name: ${SERVER_NAME:-local_wasla_backend_server}

services:
  nginx:
    image: nginx:1.30.4-alpine
    depends_on:
      django:
        condition: service_healthy
    ports:
      - 127.0.0.1:${DJANGO_PORT:-8000}:80
    restart: unless-stopped
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - staticfiles:/static:ro
      - media:/media:ro
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  postgres:
    image: postgres:17
    ports:
      - 127.0.0.1:${POSTGRES_HOST_PORT}:${POSTGRES_PORT}
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB} -p ${POSTGRES_PORT}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  django:
    build:
      context: .
      args:
        ENV: ${ENV:-local}
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    image: ${DJANGO_IMAGE:-wasla_backend:latest}
    env_file:
      - .env
    environment:
      DATABASE_TYPE: postgres
      POSTGRES_HOST: postgres
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8000"
    restart: on-failure
    command: >
      bash -c "
      python manage.py collectstatic --no-input &&
      python manage.py migrate &&
      gunicorn project.asgi:application -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:8000 --workers 2 --timeout 0 --log-level info --access-logfile - --error-logfile -
      "
    volumes:
      - media:/django/media
      - staticfiles:/django/staticfiles
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8000/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  db_data:
  media:
  staticfiles:
