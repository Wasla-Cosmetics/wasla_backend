name: Pull Request Pipeline

on:
  pull_request:
    branches:
      - "**"

permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  tests:
    name: Django checks and tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ENV: local
      DATABASE_TYPE: sqlite3
      SQLITE_NAME: /tmp/wasla-ci.sqlite3
      SECRET_KEY: ci-only-secret-key
      ALLOWED_HOSTS: localhost,127.0.0.1
      DEBUG: "False"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/base.txt

      - name: Install dependencies
        run: python -m pip install -r requirements/base.txt

      - name: Run Django system checks
        run: python manage.py check

      - name: Run tests
        run: python manage.py test

  formatter:
    name: Black formatting
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/local.txt

      - name: Install Black
        run: python -m pip install black==26.5.1

      - name: Check formatting
        run: black . --check
