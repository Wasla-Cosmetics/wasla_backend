name: Deploy

on:
  push:
    branches: [dev, stage, master]
  workflow_dispatch:
    inputs:
      git_branch:
        description: Branch to deploy
        type: choice
        required: true
        default: dev
        options: [dev, stage, master]

permissions:
  contents: read

concurrency:
  group: wasla-backend-${{ inputs.git_branch || github.ref_name }}
  cancel-in-progress: false

jobs:
  quality:
    name: Verify deployment candidate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: wasla_ci
          POSTGRES_USER: wasla_ci
          POSTGRES_PASSWORD: wasla_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wasla_ci -d wasla_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ENV: local
      DATABASE_TYPE: postgres
      POSTGRES_DB: wasla_ci
      POSTGRES_USER: wasla_ci
      POSTGRES_PASSWORD: wasla_ci
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: 5432
      SECRET_KEY: deployment-quality-secret
      ALLOWED_HOSTS: localhost,127.0.0.1
      DEBUG: "False"

    steps:
      - name: Checkout deployment candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.git_branch || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/base.lock

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes gettext
          python -m pip install -r requirements/base.lock
          python -m pip install pip-audit==2.10.1 pip-tools==7.6.2

      - name: Verify application
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
          python manage.py compilemessages --ignore ".venv/*" --verbosity 0
          python manage.py test
          pip-compile --no-header --no-annotate --strip-extras --generate-hashes --resolver=backtracking --output-file=requirements/base.lock requirements/base.txt
          git diff --exit-code -- requirements/base.lock
          pip-audit --require-hashes -r requirements/base.lock

      - name: Verify production settings
        env:
          ENV: production
          SECRET_KEY: ci-production-check-secret-key-with-more-than-fifty-characters
          ALLOWED_HOSTS: api.example.com
          TRUSTED_PROXY_COUNT: "1"
          AUTH_OTP_DELIVERY_BACKEND: apps.authentication.otp.WebhookOtpDeliveryBackend
          AUTH_OTP_WEBHOOK_URL: https://sms.example.com/otp
          AUTH_OTP_WEBHOOK_TOKEN: ci-only-token
        run: python manage.py check --deploy --fail-level ERROR

  deploy:
    name: Deploy to ${{ inputs.git_branch || github.ref_name }}
    runs-on: ubuntu-latest
    needs: quality
    environment: ${{ inputs.git_branch || github.ref_name }}

    steps:
      - name: Checkout verified revision
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.git_branch || github.sha }}

      - name: Select deployment configuration
        env:
          BRANCH: ${{ inputs.git_branch || github.ref_name }}
          DEV_DEPLOY_PATH: ${{ vars.DEV_DEPLOY_PATH }}
          STAGE_DEPLOY_PATH: ${{ vars.STAGE_DEPLOY_PATH }}
          MASTER_DEPLOY_PATH: ${{ vars.MASTER_DEPLOY_PATH }}
          DEV_SERVER_NAME: ${{ vars.DEV_SERVER_NAME }}
          STAGE_SERVER_NAME: ${{ vars.STAGE_SERVER_NAME }}
          MASTER_SERVER_NAME: ${{ vars.MASTER_SERVER_NAME }}
          DEV_DJANGO_PORT: ${{ vars.DEV_DJANGO_PORT }}
          STAGE_DJANGO_PORT: ${{ vars.STAGE_DJANGO_PORT }}
          MASTER_DJANGO_PORT: ${{ vars.MASTER_DJANGO_PORT }}
          DEV_POSTGRES_HOST_PORT: ${{ vars.DEV_POSTGRES_HOST_PORT }}
          STAGE_POSTGRES_HOST_PORT: ${{ vars.STAGE_POSTGRES_HOST_PORT }}
          MASTER_POSTGRES_HOST_PORT: ${{ vars.MASTER_POSTGRES_HOST_PORT }}
          DEV_ALLOWED_HOSTS: ${{ vars.DEV_ALLOWED_HOSTS }}
          STAGE_ALLOWED_HOSTS: ${{ vars.STAGE_ALLOWED_HOSTS }}
          MASTER_ALLOWED_HOSTS: ${{ vars.MASTER_ALLOWED_HOSTS }}
          DEV_CSRF_TRUSTED_ORIGINS: ${{ vars.DEV_CSRF_TRUSTED_ORIGINS }}
          STAGE_CSRF_TRUSTED_ORIGINS: ${{ vars.STAGE_CSRF_TRUSTED_ORIGINS }}
          MASTER_CSRF_TRUSTED_ORIGINS: ${{ vars.MASTER_CSRF_TRUSTED_ORIGINS }}
          STAGE_OTP_WEBHOOK_URL: ${{ vars.STAGE_OTP_WEBHOOK_URL }}
          MASTER_OTP_WEBHOOK_URL: ${{ vars.MASTER_OTP_WEBHOOK_URL }}
          STAGE_OTP_DELIVERY_BACKEND: ${{ vars.STAGE_OTP_DELIVERY_BACKEND }}
          MASTER_OTP_DELIVERY_BACKEND: ${{ vars.MASTER_OTP_DELIVERY_BACKEND }}
          STAGE_EMAIL_HOST: ${{ vars.STAGE_EMAIL_HOST }}
          MASTER_EMAIL_HOST: ${{ vars.MASTER_EMAIL_HOST }}
          STAGE_EMAIL_PORT: ${{ vars.STAGE_EMAIL_PORT }}
          MASTER_EMAIL_PORT: ${{ vars.MASTER_EMAIL_PORT }}
          STAGE_EMAIL_USE_TLS: ${{ vars.STAGE_EMAIL_USE_TLS }}
          MASTER_EMAIL_USE_TLS: ${{ vars.MASTER_EMAIL_USE_TLS }}
          STAGE_EMAIL_USE_SSL: ${{ vars.STAGE_EMAIL_USE_SSL }}
          MASTER_EMAIL_USE_SSL: ${{ vars.MASTER_EMAIL_USE_SSL }}
          STAGE_DEFAULT_FROM_EMAIL: ${{ vars.STAGE_DEFAULT_FROM_EMAIL }}
          MASTER_DEFAULT_FROM_EMAIL: ${{ vars.MASTER_DEFAULT_FROM_EMAIL }}
        run: |
          set -euo pipefail
          case "$BRANCH" in
            dev)
              deploy_path="${DEV_DEPLOY_PATH:-/home/dev/wasla_backend}"
              server_name="${DEV_SERVER_NAME:-dev_wasla_backend_server}"
              django_port="${DEV_DJANGO_PORT:-8000}"
              postgres_host_port="${DEV_POSTGRES_HOST_PORT:-5432}"
              allowed_hosts="$DEV_ALLOWED_HOSTS"
              csrf_origins="$DEV_CSRF_TRUSTED_ORIGINS"
              otp_delivery_backend="apps.authentication.otp.EmailOtpDeliveryBackend"
              otp_webhook_url=""
              compose_profiles=mailpit
              email_host=mailpit
              email_port=1025
              email_use_tls=False
              email_use_ssl=False
              default_from_email=no-reply@dev.wasla.local
              hsts_seconds=0
              environment=development
              ;;
            stage)
              deploy_path="${STAGE_DEPLOY_PATH:-/home/stage/wasla_backend}"
              server_name="${STAGE_SERVER_NAME:-stage_wasla_backend_server}"
              django_port="${STAGE_DJANGO_PORT:-8000}"
              postgres_host_port="${STAGE_POSTGRES_HOST_PORT:-5432}"
              allowed_hosts="$STAGE_ALLOWED_HOSTS"
              csrf_origins="$STAGE_CSRF_TRUSTED_ORIGINS"
              otp_delivery_backend="${STAGE_OTP_DELIVERY_BACKEND:-apps.authentication.otp.WebhookOtpDeliveryBackend}"
              otp_webhook_url="$STAGE_OTP_WEBHOOK_URL"
              compose_profiles=""
              email_host="$STAGE_EMAIL_HOST"
              email_port="${STAGE_EMAIL_PORT:-587}"
              email_use_tls="${STAGE_EMAIL_USE_TLS:-True}"
              email_use_ssl="${STAGE_EMAIL_USE_SSL:-False}"
              default_from_email="$STAGE_DEFAULT_FROM_EMAIL"
              hsts_seconds=86400
              environment=staging
              ;;
            master)
              deploy_path="${MASTER_DEPLOY_PATH:-/home/prod/wasla_backend}"
              server_name="${MASTER_SERVER_NAME:-prod_wasla_backend_server}"
              django_port="${MASTER_DJANGO_PORT:-8000}"
              postgres_host_port="${MASTER_POSTGRES_HOST_PORT:-5432}"
              allowed_hosts="$MASTER_ALLOWED_HOSTS"
              csrf_origins="$MASTER_CSRF_TRUSTED_ORIGINS"
              otp_delivery_backend="${MASTER_OTP_DELIVERY_BACKEND:-apps.authentication.otp.WebhookOtpDeliveryBackend}"
              otp_webhook_url="$MASTER_OTP_WEBHOOK_URL"
              compose_profiles=""
              email_host="$MASTER_EMAIL_HOST"
              email_port="${MASTER_EMAIL_PORT:-587}"
              email_use_tls="${MASTER_EMAIL_USE_TLS:-True}"
              email_use_ssl="${MASTER_EMAIL_USE_SSL:-False}"
              default_from_email="$MASTER_DEFAULT_FROM_EMAIL"
              hsts_seconds=31536000
              environment=production
              ;;
            *) echo "Unsupported branch: $BRANCH" >&2; exit 1 ;;
          esac

          {
            echo "GIT_BRANCH=$BRANCH"
            echo "DEPLOY_PATH=$deploy_path"
            echo "SERVER_NAME=$server_name"
            echo "DJANGO_PORT=$django_port"
            echo "POSTGRES_HOST_PORT=$postgres_host_port"
            echo "ALLOWED_HOSTS=$allowed_hosts"
            echo "CSRF_TRUSTED_ORIGINS=$csrf_origins"
            echo "TRUSTED_PROXY_COUNT=2"
            echo "COMPOSE_PROFILES=$compose_profiles"
            echo "OTP_DELIVERY_BACKEND=$otp_delivery_backend"
            echo "OTP_WEBHOOK_URL=$otp_webhook_url"
            echo "EMAIL_BACKEND=django.core.mail.backends.smtp.EmailBackend"
            echo "EMAIL_HOST=$email_host"
            echo "EMAIL_PORT=$email_port"
            echo "EMAIL_USE_TLS=$email_use_tls"
            echo "EMAIL_USE_SSL=$email_use_ssl"
            echo "DEFAULT_FROM_EMAIL=$default_from_email"
            echo "SECURE_HSTS_SECONDS=$hsts_seconds"
            echo "DEPLOY_SHA=$(git rev-parse HEAD)"
            echo "ENV=$environment"
          } >> "$GITHUB_ENV"

      - name: Map secrets
        env:
          GH_SSH_HOST: ${{ secrets.SSH_HOST }}
          GH_SSH_PORT: ${{ secrets.SSH_PORT }}
          GH_SSH_USER: ${{ secrets.SSH_USER }}
          GH_SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
          GH_DEV_SECRET_KEY: ${{ secrets.DEV_SECRET_KEY }}
          GH_STAGE_SECRET_KEY: ${{ secrets.STAGE_SECRET_KEY }}
          GH_MASTER_SECRET_KEY: ${{ secrets.MASTER_SECRET_KEY }}
          GH_DEV_POSTGRES_DB: ${{ secrets.DEV_POSTGRES_DB }}
          GH_STAGE_POSTGRES_DB: ${{ secrets.STAGE_POSTGRES_DB }}
          GH_MASTER_POSTGRES_DB: ${{ secrets.MASTER_POSTGRES_DB }}
          GH_DEV_POSTGRES_USER: ${{ secrets.DEV_POSTGRES_USER }}
          GH_STAGE_POSTGRES_USER: ${{ secrets.STAGE_POSTGRES_USER }}
          GH_MASTER_POSTGRES_USER: ${{ secrets.MASTER_POSTGRES_USER }}
          GH_DEV_POSTGRES_PASSWORD: ${{ secrets.DEV_POSTGRES_PASSWORD }}
          GH_STAGE_POSTGRES_PASSWORD: ${{ secrets.STAGE_POSTGRES_PASSWORD }}
          GH_MASTER_POSTGRES_PASSWORD: ${{ secrets.MASTER_POSTGRES_PASSWORD }}
          GH_STAGE_OTP_WEBHOOK_TOKEN: ${{ secrets.STAGE_OTP_WEBHOOK_TOKEN }}
          GH_MASTER_OTP_WEBHOOK_TOKEN: ${{ secrets.MASTER_OTP_WEBHOOK_TOKEN }}
          GH_STAGE_EMAIL_HOST_USER: ${{ secrets.STAGE_EMAIL_HOST_USER }}
          GH_MASTER_EMAIL_HOST_USER: ${{ secrets.MASTER_EMAIL_HOST_USER }}
          GH_STAGE_EMAIL_HOST_PASSWORD: ${{ secrets.STAGE_EMAIL_HOST_PASSWORD }}
          GH_MASTER_EMAIL_HOST_PASSWORD: ${{ secrets.MASTER_EMAIL_HOST_PASSWORD }}
        run: |
          set -euo pipefail
          case "$GIT_BRANCH" in
            dev)
              secret_key="$GH_DEV_SECRET_KEY"
              postgres_db="$GH_DEV_POSTGRES_DB"
              postgres_user="$GH_DEV_POSTGRES_USER"
              postgres_password="$GH_DEV_POSTGRES_PASSWORD"
              otp_webhook_token=""
              email_host_user=""
              email_host_password=""
              ;;
            stage)
              secret_key="$GH_STAGE_SECRET_KEY"
              postgres_db="$GH_STAGE_POSTGRES_DB"
              postgres_user="$GH_STAGE_POSTGRES_USER"
              postgres_password="$GH_STAGE_POSTGRES_PASSWORD"
              otp_webhook_token="$GH_STAGE_OTP_WEBHOOK_TOKEN"
              email_host_user="$GH_STAGE_EMAIL_HOST_USER"
              email_host_password="$GH_STAGE_EMAIL_HOST_PASSWORD"
              ;;
            master)
              secret_key="$GH_MASTER_SECRET_KEY"
              postgres_db="$GH_MASTER_POSTGRES_DB"
              postgres_user="$GH_MASTER_POSTGRES_USER"
              postgres_password="$GH_MASTER_POSTGRES_PASSWORD"
              otp_webhook_token="$GH_MASTER_OTP_WEBHOOK_TOKEN"
              email_host_user="$GH_MASTER_EMAIL_HOST_USER"
              email_host_password="$GH_MASTER_EMAIL_HOST_PASSWORD"
              ;;
          esac

          required=(GH_SSH_HOST GH_SSH_PORT GH_SSH_USER GH_SSH_PASSWORD secret_key postgres_db postgres_user postgres_password ALLOWED_HOSTS)
          case "$OTP_DELIVERY_BACKEND" in
            apps.authentication.otp.EmailOtpDeliveryBackend)
              required+=(EMAIL_HOST DEFAULT_FROM_EMAIL)
              if [ "$GIT_BRANCH" != dev ]; then
                required+=(email_host_user email_host_password)
              fi
              ;;
            apps.authentication.otp.WebhookOtpDeliveryBackend)
              required+=(otp_webhook_token OTP_WEBHOOK_URL)
              ;;
            *)
              echo "Unsupported OTP delivery backend: $OTP_DELIVERY_BACKEND" >&2
              exit 1
              ;;
          esac
          missing=()
          for name in "${required[@]}"; do
            if [ -z "${!name:-}" ]; then missing+=("$name"); fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "Missing required Actions configuration: ${missing[*]}" >&2
            exit 1
          fi

          {
            echo "SSH_HOST=$GH_SSH_HOST"
            echo "SSH_PORT=$GH_SSH_PORT"
            echo "SSH_USER=$GH_SSH_USER"
            echo "SSH_PASSWORD=$GH_SSH_PASSWORD"
            echo "SECRET_KEY=$secret_key"
            echo "POSTGRES_DB=$postgres_db"
            echo "POSTGRES_USER=$postgres_user"
            echo "POSTGRES_PASSWORD=$postgres_password"
            echo "OTP_WEBHOOK_TOKEN=$otp_webhook_token"
            echo "EMAIL_HOST_USER=$email_host_user"
            echo "EMAIL_HOST_PASSWORD=$email_host_password"
          } >> "$GITHUB_ENV"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.SSH_HOST }}
          port: ${{ env.SSH_PORT }}
          username: ${{ env.SSH_USER }}
          password: ${{ env.SSH_PASSWORD }}
          envs: GIT_BRANCH,DEPLOY_SHA,DEPLOY_PATH,SERVER_NAME,DJANGO_PORT,POSTGRES_HOST_PORT,COMPOSE_PROFILES,ENV,SECRET_KEY,ALLOWED_HOSTS,CSRF_TRUSTED_ORIGINS,TRUSTED_PROXY_COUNT,POSTGRES_DB,POSTGRES_USER,POSTGRES_PASSWORD,OTP_DELIVERY_BACKEND,OTP_WEBHOOK_URL,OTP_WEBHOOK_TOKEN,EMAIL_BACKEND,EMAIL_HOST,EMAIL_PORT,EMAIL_HOST_USER,EMAIL_HOST_PASSWORD,EMAIL_USE_TLS,EMAIL_USE_SSL,DEFAULT_FROM_EMAIL,SECURE_HSTS_SECONDS
          script: |
            set -euo pipefail
            cd "$DEPLOY_PATH"
            if [ -n "$(git status --porcelain --untracked-files=all)" ]; then
              echo "Deployment checkout has uncommitted or untracked files." >&2
              exit 1
            fi
            git fetch origin "$GIT_BRANCH"
            git merge-base --is-ancestor "$DEPLOY_SHA" "origin/$GIT_BRANCH"
            git checkout --detach "$DEPLOY_SHA"

            write_env_var() {
              local key="$1" value="$2"
              if [[ "$value" == *$'\n'* || "$value" == *$'\r'* ]]; then
                echo "Refusing multi-line value for $key" >&2
                exit 1
              fi
              value="${value//\'/\'\\\'\'}"
              printf "%s='%s'\n" "$key" "$value" >> "$tmp_env"
            }

            tmp_env="$(mktemp)"
            write_env_var SERVER_NAME "$SERVER_NAME"
            write_env_var DJANGO_IMAGE "wasla_backend:$GIT_BRANCH"
            write_env_var DJANGO_PORT "$DJANGO_PORT"
            write_env_var COMPOSE_PROFILES "$COMPOSE_PROFILES"
            write_env_var ENV "$ENV"
            write_env_var SECRET_KEY "$SECRET_KEY"
            write_env_var ALLOWED_HOSTS "$ALLOWED_HOSTS"
            write_env_var CSRF_TRUSTED_ORIGINS "$CSRF_TRUSTED_ORIGINS"
            write_env_var TRUSTED_PROXY_COUNT "$TRUSTED_PROXY_COUNT"
            write_env_var DEBUG "False"
            write_env_var SESSION_COOKIE_SECURE "True"
            write_env_var CSRF_COOKIE_SECURE "True"
            write_env_var SECURE_SSL_REDIRECT "True"
            write_env_var SECURE_HSTS_SECONDS "$SECURE_HSTS_SECONDS"
            write_env_var AUTH_OTP_DELIVERY_BACKEND "$OTP_DELIVERY_BACKEND"
            if [ "$OTP_DELIVERY_BACKEND" = "apps.authentication.otp.WebhookOtpDeliveryBackend" ]; then
              write_env_var AUTH_OTP_WEBHOOK_URL "$OTP_WEBHOOK_URL"
              write_env_var AUTH_OTP_WEBHOOK_TOKEN "$OTP_WEBHOOK_TOKEN"
            else
              write_env_var EMAIL_BACKEND "$EMAIL_BACKEND"
              write_env_var EMAIL_HOST "$EMAIL_HOST"
              write_env_var EMAIL_PORT "$EMAIL_PORT"
              write_env_var EMAIL_HOST_USER "$EMAIL_HOST_USER"
              write_env_var EMAIL_HOST_PASSWORD "$EMAIL_HOST_PASSWORD"
              write_env_var EMAIL_USE_TLS "$EMAIL_USE_TLS"
              write_env_var EMAIL_USE_SSL "$EMAIL_USE_SSL"
              write_env_var EMAIL_TIMEOUT_SECONDS "10"
              write_env_var DEFAULT_FROM_EMAIL "$DEFAULT_FROM_EMAIL"
            fi
            write_env_var DATABASE_TYPE "postgres"
            write_env_var POSTGRES_DB "$POSTGRES_DB"
            write_env_var POSTGRES_USER "$POSTGRES_USER"
            write_env_var POSTGRES_PASSWORD "$POSTGRES_PASSWORD"
            write_env_var POSTGRES_HOST "postgres"
            write_env_var POSTGRES_PORT "5432"
            write_env_var POSTGRES_HOST_PORT "$POSTGRES_HOST_PORT"
            mv "$tmp_env" .env
            chmod 600 .env

            docker compose config --quiet
            docker compose build
            docker compose up -d --remove-orphans --wait --wait-timeout 180
            docker compose ps
